# Local infrastructure for vsnvi-food. The app itself runs from Maven or the IDE with the `local`
# profile (see CLAUDE.md). Defaults below match the `local` profile in application.yaml, so no
# .env is needed; a .env file overrides them for both Compose and Spring.
#
#   docker compose up -d        start everything
#   docker compose down         stop (data is kept in named volumes)
#   docker compose down -v      stop and delete all local data
#
# Ports are bound to 127.0.0.1 only. Razorpay is an external service and has no container: tests
# use FakePaymentGateway, and a local run uses Razorpay test-mode keys from .env.

name: vsnvi-food

services:
  postgres:
    image: postgres:18-alpine # same image as TestcontainersConfiguration
    environment:
      POSTGRES_DB: ${DB_NAME:-vsnvi_food}
      POSTGRES_USER: ${DB_USERNAME:-vsnvi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vsnvi_local_only}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-vsnvi_local_only}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-vsnvi_local_only}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every email the app sends. Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.29
    ports:
      - "127.0.0.1:${MAIL_PORT:-1025}:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
